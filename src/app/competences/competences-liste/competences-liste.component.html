<div class="competences-container">
  @for (categoryKey of categoryKeys; track categoryKey) {
    <div class="competence-category">
      <h3 class="category-title">{{ categories[categoryKey].name }}</h3>
      
      <div class="skills-grid">
        @for (skill of categories[categoryKey].skills; track skill) {
          <p-chip 
            [label]="skill"
            styleClass="skill-chip"
          />
        }
      </div>
    </div>
  }
</div>
