<div class="competences-container">
  <div *ngFor="let categoryKey of categoryKeys" class="competence-category">
    <h3 class="category-title">{{ categories[categoryKey].name }}</h3>
    
    <div class="skills-grid">
      <p-chip 
        *ngFor="let skill of categories[categoryKey].skills"
        [label]="skill"
        styleClass="skill-chip"
      />
    </div>
  </div>
</div>
