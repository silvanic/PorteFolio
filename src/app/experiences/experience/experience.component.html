<div class="experience-container">
  <!-- Experiences Section -->
  <section class="experience-section">
    <h2 class="section-title">
      <i class="pi pi-briefcase"></i>
      {{ 'experiences.title' | translate }}
    </h2>

    <div class="missions-list">
      @for (experience of experiences; track $index) {
      <div class="company-group">
        <h3 class="company-name">{{ experience.title }}</h3>
        <div class="missions-group">
          @for (mission of experience.missions; track $index) {
          <app-experience-item [mission]="mission"></app-experience-item>
          }
        </div>
      </div>
      }
    </div>
  </section>

  <!-- Certifications Section -->
  <section class="experience-section certifications-section">
    <h2 class="section-title">
      <i class="pi pi-certificate"></i>
      {{ 'experiences.certifications' | translate }}
    </h2>

    <p-timeline [value]="formationsCertifications" align="left" styleClass="formations-timeline">
      <ng-template pTemplate="content" let-event>
        <div class="formation-item">
          <span class="formation-title">{{ event.title }}</span>
          <span class="formation-date">{{ event.date }}</span>
        </div>
      </ng-template>
    </p-timeline>
  </section>
</div>
